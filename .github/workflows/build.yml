name: Build and create packages

on:
  push:
    branches:
      - main
      - github-actions
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: codepointer
  APP_ID: org.codepointer.codepointer
  MANIFEST: org.codepointerapp.codepointer.yml
  RUNTIME_VERSION: '6.10'

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      mac_version: ${{ steps.set-version.outputs.mac_version }}
    steps:
      - name: Set version tag or commit SHA
        id: set-version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF##refs/tags/}"
          else
            tag="${GITHUB_SHA::7}"
          fi
          echo "version=${tag}" >> $GITHUB_OUTPUT
          # Only a tag names a release. Anything else is deliberately left empty, so
          # that passing it through lets CMake fall back to the version in
          # src/main.cpp - which is what a branch build or a pull request wants.
          # A 0.0.0 fallback here would override that good value.
          # No validation either: CFBundleShortVersionString wants numbers and dots,
          # and CMake already reduces a tag to its numeric core.
          mac_version=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            mac_version="${tag#v}"
          fi
          echo "mac_version=${mac_version}" >> $GITHUB_OUTPUT

  flatpak:
    name: Build Flatpak (x86_64)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak runtime/SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-kde-${{ env.RUNTIME_VERSION }}

      - name: Install KDE runtime and SDK
        run: |
          flatpak install --user -y flathub \
            org.kde.Platform//${{ env.RUNTIME_VERSION }} \
            org.kde.Sdk//${{ env.RUNTIME_VERSION }}

      - name: Build Flatpak
        run: flatpak-builder --force-clean --repo=repo builddir ${{ env.MANIFEST }}

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle repo \
            ${{ env.APP_ID }}-${{ needs.version.outputs.version }}-x86_64.flatpak \
            ${{ env.APP_ID }}

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.APP_ID }}-${{ needs.version.outputs.version }}-x86_64.flatpak
          path: ${{ env.APP_ID }}-${{ needs.version.outputs.version }}-x86_64.flatpak

  build-cmake:
    name: Build ${{ matrix.config.name }} Qt ${{ matrix.qt_version }}
    needs: version
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Windows MSVC"
            build_dir: "windows-msvc"
            os: windows-2022
            cc: "cl"
            cxx: "cl"
          - name: "Windows Clang"
            build_dir: "windows-clang"
            os: windows-2022
            cc: "clang"
            cxx: "clang++"
          - name: "Ubuntu GCC"
            build_dir: "linux-gcc"
            os: ubuntu-22.04
            cc: "gcc"
            cxx: "g++"
          - name: "Ubuntu Clang"
            build_dir: "linux-clang"
            os: ubuntu-22.04
            cc: "clang"
            cxx: "clang++"
          - name: "macOS"
            build_dir: "macos"
            os: macos-latest
            cc: "clang"
            cxx: "clang++"
        qt_version:
          - "6.10.3"
        include:
          - generators: "Ninja"
          - build_type: "Release"

    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: ${{ matrix.qt_version }}
          cache: true
          setup-python: false
      - name: Install cmake-format
        run: pip3 install cmake-format
      - name: Set up Clang 19.1.7
        if: matrix.config.os == 'windows-2022' && matrix.config.cc == 'clang'
        uses: egor-tensin/setup-clang@v1
        with:
          version: 19.1.7
          platform: x64
      - name: Install missing packages (linux)
        if: matrix.config.os == 'ubuntu-22.04'
        run: sudo apt install -y libcups2-dev
      - name: Install librsvg (macOS)
        if: matrix.config.os == 'macos-latest'
        run: brew install librsvg
      - name: Setup MSVC (Windows)
        if: matrix.config.cxx == 'cl'
        uses: step-security/msvc-dev-cmd@v1.13.1
      - name: Configure
        run: >
          cmake
          -B build/${{ matrix.config.build_dir }}
          -G "${{ matrix.generators }}"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.config.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }}
          -DBUILD_VERSION=OFFICIAL
          # Empty unless this is a tag build, which is what makes cmake read the
          # version out of src/main.cpp instead.
          -DCODEPOINTER_VERSION=${{ needs.version.outputs.mac_version }}
      - name: Build
        run: cmake --build build/${{ matrix.config.build_dir }} --parallel --verbose
      - name: Install
        run: >
          cmake --install build/${{ matrix.config.build_dir }}
          --prefix dist/${{ matrix.config.build_dir }}/usr

      - name: Create TGZ archive (Linux)
        if: matrix.config.os == 'ubuntu-22.04' && matrix.config.cc == 'gcc'
        shell: bash
        run: |
          mkdir -p dist/${{ env.APP_NAME }}
          ln -s ../${{ matrix.config.build_dir }}/usr \
            dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}-${{ matrix.config.build_dir }}-${{ needs.version.outputs.version }}
          tar -czhf \
            dist/${{ env.APP_NAME }}-${{ matrix.config.build_dir }}-qt${{ matrix.qt_version }}-${{ needs.version.outputs.version }}.tar.gz \
            -C dist/${{ env.APP_NAME }} .

      - name: Create AppImage (Linux)
        if: matrix.config.os == 'ubuntu-22.04' && matrix.config.cc == 'gcc'
        run: |
          sudo apt install -y fuse libxkbcommon-x11-0 libxcb-cursor-dev libxkbcommon-dev
          mkdir -p dist/${{ matrix.config.build_dir }}/usr/plugins/{iconengines,platforms}
          cp -av ${QT_ROOT_DIR}/plugins/iconengines/* dist/${{ matrix.config.build_dir }}/usr/plugins/iconengines/
          cp -av ${QT_ROOT_DIR}/plugins/platforms/libqwayland*.so dist/${{ matrix.config.build_dir }}/usr/plugins/platforms/
          export LD_LIBRARY_PATH=dist/${{ matrix.config.build_dir }}/usr/lib:$LD_LIBRARY_PATH
          export OUTPUT=build/${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir dist/${{ matrix.config.build_dir }} \
            --plugin qt \
            --output appimage

      - name: Upload AppImage (Linux)
        if: matrix.config.os == 'ubuntu-22.04' && matrix.config.cc == 'gcc'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-x86_64.AppImage
          path: build/${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-x86_64.AppImage

      - name: Upload TGZ archive (Linux)
        if: matrix.config.os == 'ubuntu-22.04' && matrix.config.cc == 'gcc'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.config.build_dir }}-qt${{ matrix.qt_version }}-${{ needs.version.outputs.version }}.tar.gz
          path: dist/${{ env.APP_NAME }}-${{ matrix.config.build_dir }}-qt${{ matrix.qt_version }}-${{ needs.version.outputs.version }}.tar.gz

      - name: windeployqt (Windows)
        if: matrix.config.os == 'windows-2022' && matrix.config.cc == 'cl'
        shell: cmd
        run: |
          windeployqt --release --no-translations --no-system-d3d-compiler --no-compiler-runtime --no-opengl-sw dist/${{ matrix.config.build_dir }}/usr/bin/${{ env.APP_NAME }}.exe

      - name: Create setup (Windows)
        if: matrix.config.os == 'windows-2022' && matrix.config.cc == 'cl'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: setup_script.iss
          options: /O+

      - name: Rename and upload setup (Windows)
        if: matrix.config.os == 'windows-2022' && matrix.config.cc == 'cl'
        shell: cmd
        run: |
          copy dist\${{ env.APP_NAME }}-win64.exe dist\${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-x86_64.exe

      - name: Upload renamed setup (Windows)
        if: matrix.config.os == 'windows-2022' && matrix.config.cc == 'cl'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-x86_64.exe
          path: dist/${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-x86_64.exe

      - name: Report architecture (macOS)
        id: macarch
        if: matrix.config.os == 'macos-latest'
        run: echo "arch=$(uname -m)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Bundle Qt frameworks into the app (macOS)
        if: matrix.config.os == 'macos-latest'
        env:
          MACDEPLOYQT: ${{ env.QT_ROOT_DIR }}/bin/macdeployqt
        run: |
          APP="dist/${{ matrix.config.build_dir }}/usr/${{ env.APP_NAME }}.app"
          if [ ! -d "$APP" ]; then
            echo "Expected an app bundle at $APP, found:"; ls -la dist/${{ matrix.config.build_dir }}/usr
            exit 1
          fi
          # install-qt-action does not always put the Qt bin directory on PATH, so
          # fall back to where it installed Qt.
          DEPLOY="$(command -v macdeployqt || echo "$MACDEPLOYQT")"
          if [ ! -x "$DEPLOY" ]; then
            echo "macdeployqt not found"; exit 1
          fi
          # Copy Qt frameworks and the platform plugins inside the bundle, so the
          # result runs on a machine with no Qt installed. There is no
          # -no-translations here: that is a windeployqt option, and macdeployqt
          # rejects it as unknown. Translations are a few hundred KB.
          "$DEPLOY" "$APP" -verbose=1
        shell: bash

      - name: Sign ad-hoc (macOS)
        if: matrix.config.os == 'macos-latest'
        # Ad-hoc, not a real identity. macdeployqt already ad-hoc signs what it
        # deploys, so this re-signs the finished bundle and then verifies it, which
        # turns "the signature is broken" into a CI failure instead of a surprise on
        # a user's machine. Notarisation would need a Developer ID certificate and
        # an Apple account, neither of which exists here.
        run: |
          APP="dist/${{ matrix.config.build_dir }}/usr/${{ env.APP_NAME }}.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
        shell: bash

      - name: Create DMG (macOS)
        id: dmg
        if: matrix.config.os == 'macos-latest'
        env:
          MAC_VERSION: ${{ needs.version.outputs.mac_version }}
        run: |
          APP="dist/${{ matrix.config.build_dir }}/usr/${{ env.APP_NAME }}.app"
          STAGE="$(mktemp -d)"
          # An /Applications symlink is what makes this an installer rather than an
          # archive: the user drags the app across it and it lands installed.
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          # A release is named by its version. Anything else has no version to put in
          # the name, so it is named after where it came from - and that emptiness is
          # what produced "codepointer--arm64.dmg" before.
          if [ -n "$MAC_VERSION" ]; then
            NAME="${{ env.APP_NAME }}-${MAC_VERSION}.dmg"
          else
            NAME="${{ env.APP_NAME }}-${{ steps.macarch.outputs.arch }}-${GITHUB_SHA::7}.dmg"
          fi

          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "$STAGE" \
            -ov -format UDZO "build/$NAME"
          rm -rf "$STAGE"
          # Handed to the upload step instead of being recomputed there, so the
          # artifact name and the file on disk cannot disagree.
          echo "file=build/$NAME" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload DMG (macOS)
        if: matrix.config.os == 'macos-latest'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.file }}

  create-release:
    name: Draft GitHub Release
    needs: [build-cmake, flatpak]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true
          path: ./artifacts
      - name: Create Draft Release
        run: gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes --draft
      - name: Upload assets to release
        run: gh release upload ${{ github.ref_name }} ./artifacts/*
